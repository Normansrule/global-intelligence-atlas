# Global Intelligence Atlas — build the Tauri desktop app for Windows, macOS and Linux and attach it to a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0), or run it by hand.
name: Build desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: 'Global Intelligence Atlas (GIA) ${{ github.ref_type == ''tag'' && github.ref_name || ''v__VERSION__'' }}'
          releaseBody: |
            Desktop builds of Global Intelligence Atlas (GIA), the educational 3D Earth built on World Monitor (github.com/koala73/worldmonitor, © Elie Habib, AGPL-3.0).
            The desktop app runs the same site/ code as the web app (https://normansrule.github.io/global-intelligence-atlas/app/), so every layer and tool is the same; it adds native fetching (no CORS proxy), the flights board, the AIS ship collector and system notifications.
            Windows: .msi or -setup.exe · macOS: .dmg (aarch64 = Apple silicon, x64 = Intel) · Linux: .AppImage, .deb or .rpm.
            The apps are not code-signed; see the Download page for how to open them.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
