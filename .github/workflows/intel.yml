# Global Intelligence Atlas — refresh the reference lists behind the Intelligence toolkit (tools/fetch-intel.mjs):
# the U.S. Treasury OFAC sanctions list and the CISA Known Exploited Vulnerabilities catalogue. Then redeploy the site.
name: Refresh intelligence data
on:
  schedule:
    - cron: '41 6 * * *'   # daily, 06:41 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: intel-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Offline checks
        run: node tests/intel/test-intel.mjs
      - name: Sanctions list and exploited vulnerabilities
        run: node tools/fetch-intel.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "global-intelligence-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app/data/intel || true
          if git diff --cached --quiet; then echo "No changes"; echo "changed=false" >> "$GITHUB_ENV"; else git commit -m "data: refresh sanctions and exploited-vulnerability lists"; git pull --rebase origin main && git push; echo "changed=true" >> "$GITHUB_ENV"; fi
      - name: Redeploy the site
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
