# Global Intelligence Atlas (GIA) — retake the README screenshots and the spinning-globe GIF from the live GitHub Pages site,
# so the README shows the real app with real data. Run by hand: Actions → "Refresh README screenshots" → Run workflow.
name: Refresh README screenshots
on:
  workflow_dispatch:
    inputs:
      shots:
        description: 'Only these shots (space-separated names from tools/screenshots.py), or empty for all'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright and Pillow
        run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - name: Screenshots and GIF from the live site
        env:
          ATLAS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SHOTS: ${{ inputs.shots }}
        run: |
          export ATLAS_URL=$(echo "$ATLAS_URL" | tr 'A-Z' 'a-z')
          python3 tools/screenshots.py $(echo "$SHOTS" | tr -cd 'a-z0-9 -')
          [ -n "$SHOTS" ] || python3 tools/make_gif.py
      - name: Commit if anything changed
        run: |
          git config user.name "global-intelligence-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/docs-media video/public || true
          if git diff --cached --quiet; then echo "No changes"; echo "changed=false" >> "$GITHUB_ENV"; else git commit -m "docs: refresh README screenshots from the live site"; git pull --rebase origin main && git push; echo "changed=true" >> "$GITHUB_ENV"; fi
      - name: Redeploy the site
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
