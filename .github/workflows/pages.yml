# Global Intelligence Atlas — publish ./site to GitHub Pages on every push to main.
name: Deploy Global Intelligence Atlas to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/fetch-weather.mjs', '.github/workflows/pages.yml']
  schedule:
    - cron: '41 */6 * * *'   # refresh the wind and temperature grid four times a day
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Current wind and temperature grid (Open-Meteo)
        run: node tools/fetch-weather.mjs || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
