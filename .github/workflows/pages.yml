# Global Intelligence Atlas — publish ./site to GitHub Pages on every push to main.
name: Deploy Global Intelligence Atlas to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/fetch-weather.mjs', '.github/workflows/pages.yml']
  schedule:
    - cron: '41 */6 * * *'   # refresh the wind and temperature grid four times a day
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Current wind and temperature grid (Open-Meteo)
        run: node tools/fetch-weather.mjs || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
