# Global Intelligence Atlas: open data for the infrastructure layers (tools/fetch-open-data.mjs), replacing
# World Monitor's curated lists where an open source exists: Wikidata (nuclear plants, spaceports, exchanges and
# central banks, critical-mineral mines), the NGA World Port Index and TeleGeography's Submarine Cable Map.
# Each source that fails keeps its previous file; the orphan branch `open-data` is force-pushed as one commit.
name: Open data
on:
  schedule:
    - cron: '41 5 9 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Sources to refresh (nuclear,spaceports,economic,minerals,ports,cables)'
        default: 'nuclear,spaceports,economic,minerals,ports,cables'
permissions:
  contents: write
concurrency:
  group: open-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Previous open data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --quiet --depth 1 --branch open-data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" open-data || mkdir -p open-data
      - name: Fetch
        env:
          ONLY: ${{ github.event.inputs.only || 'nuclear,spaceports,economic,minerals,ports,cables' }}
        run: node tools/fetch-open-data.mjs open-data "$ONLY"
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf open-data/.git
          cd open-data && git init --quiet && git checkout --quiet --orphan open-data \
            && git config user.name "global-intelligence-atlas-bot" \
            && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit --quiet -m "open data $(date -u +%FT%TZ)" \
            && git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" open-data
