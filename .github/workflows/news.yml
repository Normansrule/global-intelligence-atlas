# Global Intelligence Atlas: headlines and live news channels for the News tab (tools/fetch-news.mjs).
# Reads each publisher's own RSS or Atom feed and checks each broadcaster's official live stream (YouTube live
# with embedding allowed, or the broadcaster's own HLS stream with open Cross-Origin Resource Sharing), using the
# lists in site/app/js/newslist.js. Publishes to the orphan branch `news-data`. Needs no secret.
name: News data
on:
  # a push to a branch other than main checks every feed and channel live and publishes nothing
  push:
    branches-ignore: [main]
    paths: ['tools/fetch-news.mjs', 'site/app/js/newslist.js', '.github/workflows/news.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            site/app/js/newslist.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Previous news data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --quiet --depth 1 --branch news-data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news || mkdir -p news
      - name: Read feeds and check channels
        run: node tools/fetch-news.mjs news
      - name: Summary
        if: always()
        run: node tools/economy-summary.mjs news/status.json "News feeds and live channels" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf news/.git
          cd news && git init --quiet && git checkout --quiet --orphan news-data \
            && git config user.name "global-intelligence-atlas-bot" \
            && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit --quiet -m "news data $(date -u +%FT%TZ)" \
            && git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
