# Global Intelligence Atlas: end-to-end tests in a headless browser (software WebGL), on every push and pull
# request that touches the app. See tests/e2e/run.sh to run them locally.
name: Tests
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', 'proxy/**', 'tools/fetch-live.mjs', 'tools/check-workflows.py', 'README.md', 'HANDOFF.md', 'CHANGELOG.md', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: v2.16 speed (every start-up module preloaded in parallel)
        run: node tools/build-preload.mjs --check
      - name: v2.20 the whole solar system (system view, belts, spacecraft, fly to a planet, close-up NASA tiles)
        run: bash tests/e2e/run.sh test_v220.py | tee v220.log && grep -q "SUMMARY 22 / 22" v220.log
      - name: v2.19 a whole city up close (tilt, buildings with windows, parks, water, trees, street lamps)
        run: bash tests/e2e/run.sh test_v219.py | tee v219.log && grep -q "SUMMARY 22 / 22" v219.log
      - name: v2.18 close-ups that behave like the real thing (traffic following and red lights, wakes, lights after dark)
        run: bash tests/e2e/run.sh test_v218.py | tee v218.log && grep -q "SUMMARY 10 / 10" v218.log
      - name: v2.17 the Earth sooner, the Sun-lit Earth under close-up imagery, cables that fade at the whole-globe view
        run: bash tests/e2e/run.sh test_v217.py | tee v217.log && grep -q "SUMMARY 14 / 14" v217.log
      - name: v2.16 Print look and lifelike close-ups (3D ships, simulated traffic on real roads, buildings)
        run: bash tests/e2e/run.sh test_print.py | tee print.log && grep -q "SUMMARY 8 / 8" print.log && bash tests/e2e/run.sh test_closeup.py | tee closeup.log && grep -q "SUMMARY 16 / 16" closeup.log
      - name: v2.15 air quality, US weather warnings, Listen and sound
        run: bash tests/e2e/run.sh test_sense.py | tee sense.log && grep -q "35/35 passed" sense.log
      - name: Regression test (recorded real snapshot)
        run: MOCK_REAL=1 bash tests/e2e/run.sh test_v2.py | tee e2e.log && grep -q "SUMMARY 15 / 15" e2e.log
      - name: v2.1 features (fires, radar, data health, watch areas, aircraft types)
        run: bash tests/e2e/run.sh test_v21.py | tee v21.log && grep -q "SUMMARY 17 / 17" v21.log
      - name: v2.2 ships worldwide (snapshot, Baltic fallback, proxy and desktop paths)
        run: bash tests/e2e/run.sh test_v22.py | tee v22.log && grep -q "SUMMARY 18 / 18" v22.log
      - name: v2.3 terrain and buildings (landscape, Street level, 3D surroundings)
        run: bash tests/e2e/run.sh test_v23.py | tee v23.log && grep -q "SUMMARY 15 / 15" v23.log
      - name: v2.12 News tab (headlines, live TV, offline fetcher checks)
        run: node tests/news/test-news.mjs && bash tests/e2e/run.sh test_news.py | tee news.log && grep -q "SUMMARY 25 / 25" news.log
      - name: v2.11 World Monitor baseline layers
        run: bash tests/e2e/run.sh test_wmbaseline.py | tee wmb.log && grep -qE "SUMMARY ([0-9]+) / \\1$" wmb.log
      - name: v2.11 markers that share a spot (spread up close, listed from afar)
        run: bash tests/e2e/run.sh test_colocated.py | tee colo.log && grep -q "SUMMARY 7 / 7" colo.log
      - name: v2.11 camera source parsers (offline)
        run: for t in tests/cameras/*.test.mjs; do node "$t" || exit 1; done
      - name: v2.11 economy, property and industry (offline job and layers)
        run: node tests/economy/test-economy.mjs && bash tests/e2e/run.sh test_economy.py | tee econ.log && grep -q "SUMMARY 21 / 21" econ.log
      - name: v2.10 repository launch (README, branding, browser tuning)
        run: python3 tests/docs/check_readme.py && bash tests/e2e/run.sh test_v210.py | tee v210.log && grep -q "SUMMARY 10 / 10" v210.log
      - name: v2.9 open data
        run: node tests/opendata/test-open-data.mjs && bash tests/e2e/run.sh test_v29.py | tee v29.log && grep -q "SUMMARY 17 / 17" v29.log
      - name: v2.8 Water Quality Portal
        run: bash tests/e2e/run.sh test_v28.py | tee v28.log && grep -q "SUMMARY 11 / 11" v28.log
      - name: v2.7 CalEnviroScreen and ECHO
        run: bash tests/e2e/run.sh test_v27.py | tee v27.log && grep -q "SUMMARY 9 / 9" v27.log
      - name: v2.6 chemicals and environment (pesticide use, county estimates, TRI)
        run: bash tests/e2e/run.sh test_v26.py | tee v26.log && grep -q "SUMMARY 13 / 13" v26.log
      - name: Regional data job and PLSS sections
        run: node tests/regional/test-regional.mjs
      - name: v2.5 layer registry (manifests, editions, plug-ins)
        run: bash tests/e2e/run.sh test_v25.py | tee v25.log && grep -q "SUMMARY 20 / 20" v25.log
      - name: v2.4 replay (history frames, slider, play, USGS window) and reference projects
        run: bash tests/e2e/run.sh test_v24.py | tee v24.log && grep -q "SUMMARY 15 / 15" v24.log
      - name: History frames (tools/build-history.mjs)
        run: node tests/history/test-history.mjs
      - name: AISStream reader and the live-data ship collector
        run: npm install --no-save --no-audit --no-fund --prefix tests/ais ws@8.18.3 && node tests/ais/test-ais.mjs | tee ais.log && grep -q "SUMMARY 6 / 6" ais.log
      - name: Intel section (documents, redaction inspector, tools)
        run: bash tests/e2e/run.sh test_intel.py | tee intel.log && grep -qE "SUMMARY ([0-9]+) / \1$" intel.log
      - name: Security, proxy and workflows (offline)
        run: node tests/proxy/test-proxy.mjs && python3 tools/check-workflows.py .github/workflows
      - name: Security (Content Security Policy, hostile feed data, link and frame guards)
        run: bash tests/e2e/run.sh test_security.py | tee sec.log && grep -qE "SUMMARY ([0-9]+) / \\1$" sec.log
      - name: Interface overlap check
        run: bash tests/e2e/run.sh overlap.py | tee overlap.log && test "$(grep -c "no overlaps" overlap.log)" = 6
      - name: Physical weather layer (clouds, rain, lightning, fire smoke)
        run: bash tests/e2e/run.sh test_sky.py
      - name: Pins stay visible down to the closest zoom
        run: bash tests/e2e/run.sh test_pins_zoom.py | tee pins.log && grep -q "SUMMARY 4 / 4" pins.log
      - name: Intelligence toolkit (offline checks and mocked registries)
        run: node tests/intel/test-intel.mjs && bash tests/e2e/run.sh test_osint.py | tee osint.log && grep -qE "SUMMARY ([0-9]+) / \\1$" osint.log
