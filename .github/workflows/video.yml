# Global Intelligence Atlas — render the promo video with Remotion and upload it as a build artifact.
name: Render promo video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - working-directory: video
        run: |
          npm install
          npx remotion render src/index.ts GlobalIntelligenceAtlasPromo out/global-intelligence-atlas-promo.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: global-intelligence-atlas-promo
          path: video/out/global-intelligence-atlas-promo.mp4
