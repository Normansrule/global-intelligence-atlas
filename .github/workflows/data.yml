# Global Intelligence Atlas — refresh the public camera list and the OpenStreetMap ALPR snapshot, then redeploy the site.
name: Refresh camera data
on:
  schedule:
    - cron: '17 9 * * 1-6'   # cameras daily (Mon–Sat), 09:17 UTC
    - cron: '17 9 * * 0'     # Sundays: cameras + the full OpenStreetMap ALPR snapshot
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Traffic cameras
        env:
          ONTARIO_511_KEY: ${{ secrets.ONTARIO_511_KEY }}
          ALBERTA_511_KEY: ${{ secrets.ALBERTA_511_KEY }}
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: node tools/fetch-cameras.mjs
      - name: Internet facilities and radio receivers
        run: node tools/fetch-networks.mjs
      - name: Public webcams worldwide (WorldCam) — weekly, or whenever run by hand
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 0'
        run: node tools/fetch-worldcams.mjs
      - name: Licence-plate readers (OpenStreetMap) — weekly, or whenever run by hand
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 0'
        run: node tools/fetch-alpr.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "global-intelligence-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app/data/cameras.json site/app/data/networks.json site/app/data/alpr site/app/data/worldcams || true
          if git diff --cached --quiet; then echo "No changes"; echo "changed=false" >> "$GITHUB_ENV"; else git commit -m "data: refresh cameras, worldwide webcams and ALPR snapshot"; git pull --rebase origin main && git push; echo "changed=true" >> "$GITHUB_ENV"; fi
      - name: Redeploy the site
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
