# Global Intelligence Atlas (GIA) — try every camera source against the real services without committing anything.
# Runs on pushes that touch the camera fetchers on any branch other than main, and by hand. The job summary lists each
# source's count and error; the collected files are kept as a run artifact for a day.
name: Camera source check
on:
  push:
    branches-ignore: [main]
    paths: ['tools/fetch-cameras.mjs', 'tools/fetch-worldcams.mjs', 'tools/cameras/**', 'tests/cameras/**', 'tools/data/osiris-webcams.json', '.github/workflows/camera-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Offline parser tests
        run: for t in tests/cameras/*.test.mjs; do node "$t" || exit 1; done
      - name: Traffic cameras (every source, live)
        env:
          ONTARIO_511_KEY: ${{ secrets.ONTARIO_511_KEY }}
          ALBERTA_511_KEY: ${{ secrets.ALBERTA_511_KEY }}
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: node tools/fetch-cameras.mjs
      - name: Public webcams worldwide (live)
        run: node tools/fetch-worldcams.mjs
      - name: Coverage by country
        run: node tools/camera-coverage.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camera-data
          path: |
            site/app/data/cameras.json
            site/app/data/worldcams/index.json
          retention-days: 1
