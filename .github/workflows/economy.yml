# Global Intelligence Atlas: house prices, property sales, exports and heavy industry (tools/fetch-economy.mjs).
# U.S. Federal Housing Finance Agency (FHFA) House Price Index, U.S. Census Bureau American Community Survey (ACS)
# county home values, HM Land Registry UK House Price Index and Price Paid Data (aggregated to postcode district),
# Eurostat and Organisation for Economic Co-operation and Development (OECD) house price indices, CEPII BACI exports
# and Climate TRACE industrial assets. Most are published monthly to yearly, so a monthly run is plenty. Each source
# that fails keeps its previous file; the orphan branch `economy-data` is force-pushed as one commit.
# CENSUS_API_KEY (free) is needed for the county home values: the Census data API refuses requests without a key.
# The other sources need no secret.
name: Economy data
on:
  # a push to a branch other than main tries every source live and publishes nothing (a check before merging)
  push:
    branches-ignore: [main]
    paths: ['tools/fetch-economy.mjs', 'tools/economy-summary.mjs', '.github/workflows/economy.yml']
  schedule:
    - cron: '29 4 12 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Sources to refresh (fhfa,acs,ukhpi,ppd,eurostat,oecd,baci,trace)'
        default: 'fhfa,acs,ukhpi,ppd,eurostat,oecd,baci,trace'
permissions:
  contents: write
concurrency:
  group: economy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            site/app/data/countries.geojson
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Previous economy data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --quiet --depth 1 --branch economy-data "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" economy || mkdir -p economy
      - name: Fetch and boil down
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node tools/fetch-economy.mjs economy "${{ github.event.inputs.only || 'fhfa,acs,ukhpi,ppd,eurostat,oecd,baci,trace' }}"
      - name: Summary
        if: always()
        run: node tools/economy-summary.mjs economy/status.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf economy/.git
          cd economy && git init --quiet && git checkout --quiet --orphan economy-data \
            && git config user.name "global-intelligence-atlas-bot" \
            && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit --quiet -m "economy data $(date -u +%FT%TZ)" \
            && git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" economy-data
